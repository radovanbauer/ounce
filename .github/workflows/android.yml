# Builds the APK on GitHub's runners. Pushes to main also publish it as a GitHub Release, downloadable at
# https://github.com/radovanbauer/ounce/releases/latest/download/ounce.apk
# Builds are signed with the key in the SIGNING_KEYSTORE_B64 secret so each one installs as an update.
name: Android build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ounce.keystore"
            echo "OUNCE_KEYSTORE=$RUNNER_TEMP/ounce.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 not set; using a throwaway key (won't install over previous builds)"
          fi
      - name: Build
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk ounce.apk
      - name: Report build errors
        if: failure()
        # surface compiler errors as annotations (readable on the run page and through the public API)
        run: |
          grep -E "^e: |error:|What went wrong|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ounce-apk
          path: ounce.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.OUNCE_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ounce build ${{ github.run_number }}
          body: "Debug build of ${{ github.sha }}. Sideload ounce.apk on Android 12+."
          files: ounce.apk
          make_latest: true
